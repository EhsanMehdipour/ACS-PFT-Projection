[acs_pft_retrieval]

#def OpenAp
##Opening the files
ap_file=./data/1min/acs_TSalScatCorr.txt
wl_file=./data/1min/wavelength.txt

#def extract_absorption
##cleaning the wavelength and absoprtion file
first_column=0
last_column=82
start_wl=399
end_wl=701

#def read_EOF_U and read_EOF_Coef
#Open the EOF_U files (!!!important point to put '*' instead of PFT names and 
#check the PFT list in pft_retrieval_constants.py for PFT list)
EOF_U_format=./Coefficients/HPLC_data.ACS_ap_data_*_u.csv
EOF_Coef_format=./Coefficients/HPLC_data.ACS_ap_data_*_EOFcoef.csv


#def location
##Add location to the PFT_concentration DataArray
add_location=True
location_file=./data/DShip_lat_lon.csv

# put the Date and Time format with a space together
datetimeformat=%%m/%%d/%%Y %%H:%%M:%%S
delimiter=\t

#Plot
plot_dir=fig/

#3D plot
plot_spectra_3D=True
resample_rate=3h

#Spectra plot
plot_spectra=True
spectra_plot_start_time=2018-05-31 00:00:00
spectra_plot_end_time=2018-05-31 23:59:59

# PFT concentration plot
plot_concentration=True

# Save output
output_dir = ./data/1min